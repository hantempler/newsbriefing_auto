name: Daily Star is Born Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '제작 모드 (both: AM+PM 일괄, am: 탄생, pm: 기일)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - am
          - pm
      date:
        description: '대상 일자 (MM-DD, 비워두면 당일 자동)'
        required: false
        default: ''
      privacy:
        description: '유튜브 공개 상태'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public
  repository_dispatch:
    types: [trigger-starisborn, trigger-news-briefing]
  schedule:
    - cron: '0 15 * * *' # 매일 15:00 UTC = 한국 시간(KST) 자정 00:00

concurrency:
  group: starisborn-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Setup Google Cloud Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          mkdir -p config
          echo "$GCP_CREDENTIALS" > config/application_default_credentials.json

      - name: Setup YouTube Token
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p config
          echo "$YOUTUBE_TOKEN" > config/youtube_token.json

      - name: Run Star is Born Pipeline
        run: |
          MODE="both"
          PRIVACY="private"
          DATE_ARG=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            PRIVACY="${{ github.event.inputs.privacy }}"
            if [ -n "${{ github.event.inputs.date }}" ]; then
              DATE_ARG="--date ${{ github.event.inputs.date }}"
            fi
          fi

          echo "============================================================"
          echo "가동 모드: $MODE | 공개 설정: $PRIVACY | 추가 일자: $DATE_ARG"
          echo "============================================================"
          python run_daily.py --mode "$MODE" --upload --privacy "$PRIVACY" $DATE_ARG
