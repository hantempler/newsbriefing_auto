name: Daily Star is Born Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '제작 모드 (both: AM+PM 일괄, am: 탄생, pm: 기일)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - am
          - pm
      date:
        description: '대상 일자 (MM-DD, 비워두면 당일 자동)'
        required: false
        default: ''
      privacy:
        description: '유튜브 공개 상태'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public
  repository_dispatch:
    types: [trigger-starisborn, trigger-news-briefing]

concurrency:
  group: starisborn-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (Fast via uv)
        run: |
          python -m pip install --upgrade pip uv
          if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi

      - name: Setup Korean Fonts & FFmpeg
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/starisborn
          sudo cp assets/fonts/*.ttf /usr/share/fonts/truetype/starisborn/
          sudo fc-cache -f -v
          ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Setup Credentials & Tokens
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p config
          echo "$GCP_CREDENTIALS" > config/application_default_credentials.json
          echo "$YOUTUBE_TOKEN" > config/youtube_token.json

      - name: Run Star is Born Pipeline
        run: |
          MODE="both"
          PRIVACY="private"
          DATE_ARG=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            PRIVACY="${{ github.event.inputs.privacy }}"
            if [ -n "${{ github.event.inputs.date }}" ]; then
              DATE_ARG="--date ${{ github.event.inputs.date }}"
            fi
          fi

          echo "============================================================"
          echo "서버 시각 (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "한국 시각 (KST): $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S')"
          echo "가동 모드: $MODE | 공개 설정: $PRIVACY | 추가 일자: $DATE_ARG"
          echo "============================================================"
          python run_daily.py --mode "$MODE" --upload --privacy "$PRIVACY" $DATE_ARG
