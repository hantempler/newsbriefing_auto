name: Daily News Briefing Pipeline

on:
  # 수동 실행을 위한 워크플로우 디스패치
  workflow_dispatch:
    inputs:
      edition:
        description: '실행할 버전 (morning, lunch, evening, weekend_morning, weekend_evening)'
        required: true
        default: 'morning'

  # Cloudflare Workers 등 외부 API 호출을 위한 디스패치
  repository_dispatch:
    types: [trigger-news-briefing]

# 동일 그룹의 job이 이미 실행 중이면 이전 것을 취소하고 새 것을 실행
concurrency:
  group: briefing-pipeline
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 전체 job 타임아웃 (렌더링 hang 방지)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Setup Google Cloud Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          mkdir -p config
          echo "$GCP_CREDENTIALS" > config/application_default_credentials.json

      - name: Setup Naver API keys
        run: |
          echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" > config/.env
          echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> config/.env

      - name: Setup YouTube Token
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$YOUTUBE_TOKEN" > config/youtube_token.json

      # -----------------------------------------------------------------------
      # edition 결정
      # 핵심 버그 수정:
      #   - 기존: $GITHUB_ENV + ${{ env.edition }} → YAML 렌더링 타이밍 문제로 빈 값 전달
      #   - 수정: GITHUB_OUTPUT 방식 사용 → steps.set_edition.outputs.edition 으로 참조
      #   - 기존: HOUR 정확히 일치(==) → cron 지연 시 miss 발생
      #   - 수정: HOUR 범위 체크(±1시간 이내) + 시각이 안 맞으면 가장 가까운 edition 선택
      # -----------------------------------------------------------------------
      - name: Determine Edition based on time
        id: set_edition
        run: |
          EDITION=""

          # 수동 실행(workflow_dispatch)일 경우 입력값 사용
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            EDITION="${{ github.event.inputs.edition }}"
          fi

          # 외부 API 호출(repository_dispatch)일 경우 페이로드 데이터 사용
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            EDITION="${{ github.event.client_payload.edition }}"
          fi

          # 스케줄(cron) 실행일 경우 UTC 시간 기준으로 분기
          # cron 지연을 고려해 정확한 시각 일치 대신 "가장 가까운 edition" 방식 사용
          if [ "${{ github.event_name }}" == "schedule" ]; then
            HOUR=$(date -u +'%H')
            MIN=$(date -u +'%M')
            # 전체 분(0~1439) 단위로 환산해 거리 비교
            NOW_MINS=$(( HOUR * 60 + MIN ))

            # 각 edition의 목표 UTC 시각 (분 단위)
            MORNING_MINS=$(( 21 * 60 + 33 ))  # 21:33 UTC
            LUNCH_MINS=$(( 2 * 60 + 7 ))       # 02:07 UTC
            EVENING_MINS=$(( 7 * 60 + 11 ))    # 07:11 UTC

            # 거리 계산 (자정을 넘는 경우 처리)
            dist() {
              local a=$1 b=$2 total=1440
              local d=$(( a - b ))
              d=${d#-}  # 절댓값
              if [ $d -gt 720 ]; then d=$(( total - d )); fi
              echo $d
            }

            D_MORNING=$(dist $NOW_MINS $MORNING_MINS)
            D_LUNCH=$(dist $NOW_MINS $LUNCH_MINS)
            D_EVENING=$(dist $NOW_MINS $EVENING_MINS)

            echo "DEBUG: NOW=${HOUR}:${MIN} UTC (${NOW_MINS}min)"
            echo "DEBUG: dist_morning=${D_MORNING}, dist_lunch=${D_LUNCH}, dist_evening=${D_EVENING}"

            # 가장 가까운 edition 선택 (단, 90분 이내일 때만 — 너무 먼 건 오동작 방지)
            MIN_DIST=$D_MORNING
            EDITION="morning"
            if [ $D_LUNCH -lt $MIN_DIST ]; then MIN_DIST=$D_LUNCH; EDITION="lunch"; fi
            if [ $D_EVENING -lt $MIN_DIST ]; then MIN_DIST=$D_EVENING; EDITION="evening"; fi

            if [ $MIN_DIST -gt 90 ]; then
              echo "ERROR: 현재 시각(${HOUR}:${MIN} UTC)이 어떤 edition과도 90분 이상 차이납니다. 실행 중단."
              exit 1
            fi
          fi

          # 최종 fallback — 여기까지 왔는데 EDITION이 비어있으면 강제 오류
          if [ -z "$EDITION" ]; then
            echo "ERROR: edition을 결정할 수 없습니다. event_name=${{ github.event_name }}"
            exit 1
          fi

          echo "✅ 결정된 edition: $EDITION"
          # GITHUB_OUTPUT 방식으로 저장 (다음 step에서 steps.set_edition.outputs.edition 으로 참조)
          echo "edition=$EDITION" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # 파이프라인 실행 (실패 시 최대 3회 재시도)
      # nick-fields/retry action 사용:
      #   - max_attempts: 3
      #   - retry_wait_seconds: 60 (1분 대기 후 재시도)
      #   - timeout_minutes: 50 (단일 시도 타임아웃)
      # -----------------------------------------------------------------------
      - name: Run Pipeline (Headless mode) with retry
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_minutes: 50
          command: |
            EDITION="${{ steps.set_edition.outputs.edition }}"
            echo "Executing headless pipeline for edition: $EDITION"
            python src/auto_run.py --edition "$EDITION"

      - name: Save history and cleanup old files
        run: |
          # 3일 지난 히스토리 파일 삭제
          find data/ -name "history_*.json" -type f -mtime +3 -delete
          
          # Git 설정 (GitHub Actions 봇으로 커밋)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경된 히스토리 파일 추가 (강제)
          git add -f data/history_*.json
          
          # 변경사항이 있을 때만 커밋하고 푸시
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily history and cleanup [skip ci]"
            git push
          fi
