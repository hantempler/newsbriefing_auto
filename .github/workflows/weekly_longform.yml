name: Weekly Star is Born Longform Documentary Pipeline

on:
  workflow_dispatch:
    inputs:
      person:
        description: '다큐멘터리 주인공 인물명 (한글)'
        required: true
        default: '웨인 루니'
        type: string
      en:
        description: '인물명 (영문)'
        required: false
        default: 'Wayne Rooney'
        type: string
      category:
        description: '인물 카테고리 / 분야'
        required: false
        default: '스포츠 / 축구 레전드'
        type: string
      theme:
        description: '심층 탐사 핵심 테마'
        required: false
        default: '길거리 싸움꾼 소년이 잉글랜드 역사상 가장 위대한 골잡이가 되기까지의 드라마'
        type: string
      step:
        description: '실행 단계 (script: 대본/연출지시서, all: 영상/TTS 풀제작)'
        required: true
        default: 'script'
        type: choice
        options:
          - script
          - research
          - art
          - tts
          - all

# 데일리 숏폼 그룹(starisborn-pipeline)과 완전히 분리된 롱폼 전용 동시성 제어 그룹
concurrency:
  group: starisborn-longform
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-longform:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (Fast via uv)
        run: |
          python -m pip install --upgrade pip uv
          if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi

      - name: Setup Korean Fonts & FFmpeg
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/starisborn
          sudo cp assets/fonts/*.ttf /usr/share/fonts/truetype/starisborn/ 2>/dev/null || true
          sudo fc-cache -f -v
          ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Setup Credentials & Tokens
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p config
          echo "$GCP_CREDENTIALS" > config/application_default_credentials.json
          echo "$YOUTUBE_TOKEN" > config/youtube_token.json

      - name: Run Star is Born Longform Pipeline
        run: |
          PERSON="${{ github.event.inputs.person }}"
          EN="${{ github.event.inputs.en }}"
          CAT="${{ github.event.inputs.category }}"
          THEME="${{ github.event.inputs.theme }}"
          STEP="${{ github.event.inputs.step }}"

          echo "============================================================"
          echo "🎬 주말 롱폼 시네마틱 다큐멘터리 파이프라인 가동"
          echo "인물: $PERSON ($EN) | 분야: $CAT | 단계: $STEP"
          echo "🛡️ 데일리 숏폼 파이프라인 100% 완전 격리 실행"
          echo "============================================================"
          python longform/run_longform.py --person "$PERSON" --en "$EN" --category "$CAT" --theme "$THEME" --step "$STEP"

      - name: Archive Longform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: longform-output-${{ github.event.inputs.person }}
          path: longform/output/
          if-no-files-found: warn
